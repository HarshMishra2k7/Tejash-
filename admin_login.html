<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TradeSphere - Admin Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="static/style.css">

</head>

<body>

<div class="container">

    <div class="text-center">

        <h1 style="color:#ff2d55;">🛡️ Admin Panel</h1>

        <p class="subtitle">

            Administrator Secure Login

        </p>

    </div>

    <form method="POST" action="#" onsubmit="return TradeSphereDemo.handleForm(event);">

        <input
        type="text"
        name="username"
        class="form-control"
        placeholder="👤 Username"
        required>

        <input
        type="password"
        name="password"
        class="form-control"
        placeholder="🔒 Password"
        required>

        <button
        type="submit"
        class="btn admin-login-btn">

            🔐 Admin Login

        </button>

    </form>

    <div class="login-link">

        <a href="index.html">

            🏠 Back to Home

        </a>

    </div>

</div>

<script src="script.js"></script>
</body>

</html>
