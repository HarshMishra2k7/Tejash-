<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TradeSphere - Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="static/style.css">

</head>

<body>

<div class="container">

    <div class="text-center mb-4">

        <h1>📈 TradeSphere</h1>

        <p class="subtitle">
            Welcome Back! Login to continue trading.
        </p>

    </div>

    <form method="POST" action="#" onsubmit="return TradeSphereDemo.handleForm(event);">

        <div class="mb-3">

            <input
                type="email"
                name="email"
                class="form-control"
                placeholder="📧 Email Address"
                required>

        </div>

        <div class="mb-3">

            <input
                type="password"
                name="password"
                class="form-control"
                placeholder="🔒 Password"
                required>

        </div>

        <button
            type="submit"
            class="btn btn-success w-100">

            🚀 Login

        </button>

    </form>

    <div class="login-link">

        <p class="mt-4">

            Don't have an account?

            <a href="register.html">

                Register

            </a>

        </p>

    </div>

    <div class="text-center mt-3">

        <a href="index.html" class="btn btn-outline-light w-100">

            🏠 Back to Home

        </a>

    </div>

</div>

<script src="script.js"></script>
</body>

</html>
