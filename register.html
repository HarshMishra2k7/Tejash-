<!DOCTYPE html>
<html>

<head>

    <title>Register</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
    href="static/style.css">

</head>

<body>

<div class="container">

<h1>Create Account</h1>

<form method="POST" action="#" onsubmit="return TradeSphereDemo.handleForm(event);">

<input
type="text"
name="name"
class="form-control"
placeholder="Full Name"
required>

<input
type="email"
name="email"
class="form-control"
placeholder="Email"
required>

<input
type="password"
name="password"
class="form-control"
placeholder="Password"
required>

<button class="btn btn-success">
Register
</button>

</form>

<div class="login-link">

Already have an account?

<a href="login.html">

Login

</a>

</div>

</div>

<script src="script.js"></script>
</body>

</html>
